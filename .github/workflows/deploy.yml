name: Deploy to Cloudflare Pages

# Every push to main rebuilds the site and deploys it to Cloudflare Pages,
# so anything merged on GitHub automatically lands on the live site.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deploys ./dist to the Cloudflare Pages project named in wrangler.toml.
      # D1 schema/columns are auto-created at runtime by the API (ensureTables),
      # so no separate migration step is required here.
      #
      # This step is SKIPPED until you add the CLOUDFLARE_API_TOKEN secret — so if
      # you instead connect the repo via the Cloudflare Pages dashboard ("Connect
      # to Git"), this workflow won't clash or fail; it just no-ops.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # Create the Pages project on first run (ignored if it already exists).
          npx --yes wrangler@4 pages project create my-website --production-branch=main > create.log 2>&1
          npx --yes wrangler@4 pages deploy dist --project-name=my-website --branch=main > deploy.log 2>&1
          code=$?
          cat create.log deploy.log
          if [ $code -ne 0 ]; then
            echo "::error title=create::$(tail -n 8 create.log | tr '\n' ' ')"
            echo "::error title=deploy::$(tail -n 15 deploy.log | tr '\n' ' ')"
            exit $code
          fi
